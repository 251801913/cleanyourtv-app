name: Build Chinese (zh-rCN) APK

# 构建「清理你的电视」中文版 APK。
# 本仓库已在各模块的 res/values-zh-rCN/ 提供简体中文字符串资源，
# Android 构建时会自动合并这些资源，无需改动任何代码。
#
# 用法：
#   1) 把本分支（zh-cn）推送到你自己的 GitHub Fork；
#   2) 在仓库 Actions 页手动运行 "Build Chinese (zh-rCN) APK"，或推送/更新 zh-cn 分支自动触发；
#   3) 在 Artifacts 中下载 cleanyourtv-zh-unsigned-apk（未签名 APK）；
#   4) 用你自己的 keystore 签名后即可安装（见《构建中文版说明.md》）。

on:
  workflow_dispatch:
  push:
    branches: [zh-cn]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout (含 TV 列表子模块 third_party/cleanyourtv)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          # GitHub ubuntu 运行机已预装 Android SDK（含 cmdline-tools/latest），
          # 弃用易与运行机镜像冲突的第三方 action（android-actions/setup-android@v3）。
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build full release APK (中文资源随构建自动包含)
        run: ./gradlew :app:assembleFullRelease --no-daemon

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-zh-unsigned-apk
          path: app/build/outputs/apk/full/release/*.apk
          retention-days: 90
